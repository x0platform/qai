name: Publish Reports

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run id containing the test-reports artifact
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish test reports to GitHub Pages
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Resolve source CI run
        id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          INPUT_RUN_ID: ${{ inputs.run_id || '' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          async function main() {
            const api = process.env.GITHUB_API_URL || 'https://api.github.com';
            const token = process.env.GITHUB_TOKEN;
            const repo = process.env.REPOSITORY;
            let runId = process.env.WORKFLOW_RUN_ID || process.env.INPUT_RUN_ID;

            if (!runId) {
              const response = await fetch(`${api}/repos/${repo}/actions/runs?status=success&per_page=20`, {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json'
                }
              });
              if (!response.ok) throw new Error(`Unable to list CI runs: ${response.status}`);
              const data = await response.json();
              const run = data.workflow_runs.find((item) => item.name === 'CI');
              if (!run) throw new Error('No successful CI run found');
              runId = String(run.id);
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${runId}\n`);
            console.log(`Using CI run ${runId}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Download test report artifact
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports-out

      - name: Create Pages index
        run: |
          cat > reports-out/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=cucumber-report.html">
              <title>QAI Test Reports</title>
            </head>
            <body>
              <p><a href="cucumber-report.html">Open the latest Cucumber report</a></p>
            </body>
          </html>
          HTML

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./reports-out
          keep_files: false
          force_orphan: true
          commit_message: "chore: publish test reports from run ${{ steps.source.outputs.run_id }}"
